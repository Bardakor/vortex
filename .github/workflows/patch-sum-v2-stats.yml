name: Patch SumV2 stats

on:
  push:
    branches:
      - fix/sum-v2-stats

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply SumV2 stats integration
        run: |
          python - <<'PY'
          from pathlib import Path

          stats_array = Path("vortex-array/src/stats/array.rs")
          src = stats_array.read_text()
          old = "use crate::aggregate_fn::fns::sum::sum;"
          new = "use crate::aggregate_fn::fns::sum_v2::sum_v2;"
          assert src.count(old) == 1
          src = src.replace(old, new, 1)
          old = "                        sum(self.dyn_array_ref, ctx)\n"
          new = "                        sum_v2(self.dyn_array_ref, ctx)\n"
          assert src.count(old) == 1
          stats_array.write_text(src.replace(old, new, 1))

          stats_mod = Path("vortex-array/src/expr/stats/mod.rs")
          src = stats_mod.read_text()
          old = "                return aggregate_fn::fns::sum::Sum\n                    .return_dtype(&NumericalAggregateOpts::skip_nans(), data_type);\n"
          new = "                return aggregate_fn::fns::sum_v2::SumV2\n                    .return_dtype(&NumericalAggregateOpts::skip_nans(), data_type);\n"
          assert src.count(old) == 1
          src = src.replace(old, new, 1)
          old = "            Self::Sum => aggregate_fn::fns::sum::Sum.bind(NumericalAggregateOpts::skip_nans()),\n"
          new = "            Self::Sum => {\n                aggregate_fn::fns::sum_v2::SumV2.bind(NumericalAggregateOpts::skip_nans())\n            }\n"
          assert src.count(old) == 1
          src = src.replace(old, new, 1)
          old = "    pub fn from_aggregate_fn(aggregate_fn: &AggregateFnRef) -> Option<Self> {\n        if let Some(options) = aggregate_fn.as_opt::<aggregate_fn::fns::sum::Sum>() {\n            return options.skip_nans.then_some(Self::Sum);\n        }\n"
          new = "    pub fn from_aggregate_fn(aggregate_fn: &AggregateFnRef) -> Option<Self> {\n        if let Some(options) = aggregate_fn.as_opt::<aggregate_fn::fns::sum_v2::SumV2>() {\n            return options.skip_nans.then_some(Self::Sum);\n        }\n        // Legacy files may still store the original `vortex.sum` aggregate in the Sum stat slot.\n        if let Some(options) = aggregate_fn.as_opt::<aggregate_fn::fns::sum::Sum>() {\n            return options.skip_nans.then_some(Self::Sum);\n        }\n"
          assert src.count(old) == 1
          src = src.replace(old, new, 1)
          old = "    use crate::VortexSessionExecute;\n    use crate::array_session;\n    use crate::arrays::PrimitiveArray;\n    use crate::expr::stats::Stat;\n"
          new = "    use crate::VortexSessionExecute;\n    use crate::aggregate_fn::AggregateFnVTableExt;\n    use crate::aggregate_fn::NumericalAggregateOpts;\n    use crate::aggregate_fn::fns::sum::Sum as LegacySum;\n    use crate::aggregate_fn::fns::sum_v2::SumV2;\n    use crate::array_session;\n    use crate::arrays::PrimitiveArray;\n    use crate::expr::stats::Stat;\n"
          assert src.count(old) == 1
          src = src.replace(old, new, 1)
          marker = "    #[test]\n    fn has_same_dtype_as_array() {\n"
          tests = "    #[test]\n    fn sum_stat_uses_sum_v2() {\n        let aggregate = Stat::Sum.aggregate_fn().expect(\"Sum has an aggregate\");\n        assert!(aggregate.is::<SumV2>());\n        assert_eq!(Stat::from_aggregate_fn(&aggregate), Some(Stat::Sum));\n\n        let legacy = LegacySum.bind(NumericalAggregateOpts::skip_nans());\n        assert_eq!(Stat::from_aggregate_fn(&legacy), Some(Stat::Sum));\n    }\n\n    #[test]\n    fn sum_stat_of_all_nulls_is_null() {\n        let array = PrimitiveArray::from_option_iter::<i32, _>([None, None]);\n        let sum = array\n            .statistics()\n            .compute_stat(Stat::Sum, &mut array_session().create_execution_ctx())\n            .unwrap()\n            .expect(\"i32 supports Sum\");\n\n        assert!(sum.is_null());\n    }\n\n"
          assert src.count(marker) == 1
          stats_mod.write_text(src.replace(marker, tests + marker, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test vortex-array
        run: cargo test -p vortex-array --lib
      - name: Check diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vortex-array/src/stats/array.rs vortex-array/src/expr/stats/mod.rs
          git diff --cached --check
          git commit -m "fix: use SumV2 for array statistics"
          git push
