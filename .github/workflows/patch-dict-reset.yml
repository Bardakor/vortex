name: Patch dict reset state

on:
  push:
    branches:
      - fix/dict-reset-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply fix and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def lines(*items):
              return "\n".join(items) + "\n"

          bytes_path = Path("vortex-array/src/builders/dict/bytes.rs")
          src = bytes_path.read_text()
          needle = lines(
              "        let value_nulls = mem::take(&mut self.values_nulls).freeze();",
              "",
              "        // SAFETY: we build the views explicitly and the bytes should be checked before feeding",
          )
          replacement = lines(
              "        let value_nulls = mem::take(&mut self.values_nulls).freeze();",
              "        self.lookup = Some(HashTable::new());",
              "        self.null_code = OnceCell::new();",
              "",
              "        // SAFETY: we build the views explicitly and the bytes should be checked before feeding",
          )
          assert src.count(needle) == 1
          src = src.replace(needle, replacement, 1)

          marker = lines(
              "    #[test]",
              "    fn repeated_values() -> VortexResult<()> {",
          )
          test = lines(
              "    #[test]",
              "    fn reset_clears_encoder_state() -> VortexResult<()> {",
              "        let first = VarBinViewArray::from_iter_str([\"one\", \"two\"]).into_array();",
              "        let mut encoder = crate::builders::dict::dict_encoder(",
              "            &first,",
              "            &crate::builders::dict::UNCONSTRAINED,",
              "        );",
              "        let mut ctx = SESSION.create_execution_ctx();",
              "        encoder.encode(&first, &mut ctx)?;",
              "        encoder.reset();",
              "",
              "        let second = VarBinViewArray::from_iter_str([\"one\", \"three\"]).into_array();",
              "        let codes = encoder.encode(&second, &mut ctx)?;",
              "        assert_eq!(codes.len(), 2);",
              "",
              "        let values = encoder.reset().execute::<VarBinViewArray>(&mut ctx)?;",
              "        assert_eq!(values.bytes_at(0), b\"one\");",
              "        assert_eq!(values.bytes_at(1), b\"three\");",
              "        Ok(())",
              "    }",
              "",
          )
          assert src.count(marker) == 1
          bytes_path.write_text(src.replace(marker, test + marker, 1))

          primitive_path = Path("vortex-array/src/builders/dict/primitive.rs")
          src = primitive_path.read_text()
          old = lines(
              "    fn reset(&mut self) -> ArrayRef {",
              "        PrimitiveArray::new(",
              "            self.values.clone(),",
              "            Validity::from_bit_buffer(mem::take(&mut self.values_nulls).freeze(), self.nullability),",
              "        )",
              "        .into_array()",
              "    }",
          )
          new = lines(
              "    fn reset(&mut self) -> ArrayRef {",
              "        let values = mem::take(&mut self.values);",
              "        let values_nulls = mem::take(&mut self.values_nulls).freeze();",
              "        self.lookup.clear();",
              "        self.null_code = OnceCell::new();",
              "",
              "        PrimitiveArray::new(",
              "            values,",
              "            Validity::from_bit_buffer(values_nulls, self.nullability),",
              "        )",
              "        .into_array()",
              "    }",
          )
          assert src.count(old) == 1
          src = src.replace(old, new, 1)

          marker = lines(
              "    #[test]",
              "    fn encode_primitive_nulls() {",
          )
          test = lines(
              "    #[test]",
              "    fn reset_clears_encoder_state() {",
              "        let first = PrimitiveArray::from_option_iter([Some(1i32), None, Some(3)]).into_array();",
              "        let mut encoder = crate::builders::dict::dict_encoder(",
              "            &first,",
              "            &crate::builders::dict::UNCONSTRAINED,",
              "        );",
              "        let mut ctx = SESSION.create_execution_ctx();",
              "        encoder.encode(&first, &mut ctx).unwrap();",
              "        encoder.reset();",
              "",
              "        let second = PrimitiveArray::from_option_iter([Some(4i32), Some(5)]).into_array();",
              "        let codes = encoder.encode(&second, &mut ctx).unwrap();",
              "        assert_eq!(codes.as_slice::<u32>(), &[0, 1]);",
              "",
              "        let values = encoder.reset();",
              "        let expected_values = buffer![4i32, 5].into_array();",
              "        assert_arrays_eq!(&values, expected_values, &mut ctx);",
              "    }",
              "",
          )
          assert src.count(marker) == 1
          primitive_path.write_text(src.replace(marker, test + marker, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Test dictionary builders
        run: cargo test -p vortex-array builders::dict --lib
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vortex-array/src/builders/dict/bytes.rs vortex-array/src/builders/dict/primitive.rs
          git diff --cached --check
          git commit -m "fix: clear dictionary encoder state on reset"
          git push
